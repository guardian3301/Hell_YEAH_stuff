modLoader = "javafml"
# FancyModLoader 4.x — ветка, идущая с NeoForge 21.1.x (Minecraft 1.21.1).
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "hell_yeah_stuff"
version = "1.0.0"
displayName = "Hell Yeah Stuff"
description = '''
Mini crossbow with darts (regular, explosive, grapple) and rifles (iron / amethyst).
Dying Light 2 style grappling hook.
'''
authors = "you"

# 21.1.x — вся ветка NeoForge для Minecraft 1.21.1.
[[dependencies.hell_yeah_stuff]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,22.0.0)"
ordering = "NONE"
side = "BOTH"

[[dependencies.hell_yeah_stuff]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

# Конфиг миксинов (поворот руки с тросом в PlayerModel).
# NeoForge использует официальные маппинги в рантайме — refmap не нужен.
[[mixins]]
config = "hell_yeah_stuff.mixins.json"

# Мягкие миксины совместимости со сторонними модами (required = false).
# Сейчас: Death Keeper — защита от краша "Cannot encode empty ItemStack"
# на могилах, где лежат предметы, удалённые из реестра.
[[mixins]]
config = "hell_yeah_stuff.compat.mixins.json"
